<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop Check-In &amp; Service History</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a paper work-order ticket. Grey ruled label cells, licence-plate chips as the key identifier, status as coloured pills. */
:root{
  --paper:#f2f3f0;
  --surface:#ffffff;
  --ink:#17202b;
  --muted:#5b6573;
  --line:#d8dcd6;
  --accent:#1c4ba3;
  --accent-ink:#ffffff;
  --accent-soft:#e5ecf8;
  --line-strong:#b9bfb8;
  --label-bg:#e8eae6;
  --field:#ffffff;
  --ok:#1d7349; --ok-soft:#e2f2e9;
  --warn:#9a5b00; --warn-soft:#fbefd9;
  --crit:#b3261e; --crit-soft:#fbe4e2;
  --info:#0f6a80; --info-soft:#def1f5;
  --queue:#5b45b0; --queue-soft:#ece8fb;
  --shadow:0 1px 2px rgba(20,28,40,.06),0 4px 14px rgba(20,28,40,.06);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151b; --surface:#1a2029; --ink:#e7eaee; --muted:#9aa4b2; --line:#2b333e;
    --accent:#7ea4ff; --accent-ink:#0a1222; --accent-soft:#1c2a46;
    --line-strong:#3c4653; --label-bg:#222a35; --field:#141920;
    --ok:#5fc98f; --ok-soft:#173326; --warn:#f0b452; --warn-soft:#3a2b12;
    --crit:#ff8a80; --crit-soft:#3d1c1a; --info:#6fd0e6; --info-soft:#14313a; --queue:#c0b3ff; --queue-soft:#2a2448;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151b; --surface:#1a2029; --ink:#e7eaee; --muted:#9aa4b2; --line:#2b333e;
  --accent:#7ea4ff; --accent-ink:#0a1222; --accent-soft:#1c2a46;
  --line-strong:#3c4653; --label-bg:#222a35; --field:#141920;
  --ok:#5fc98f; --ok-soft:#173326; --warn:#f0b452; --warn-soft:#3a2b12;
  --crit:#ff8a80; --crit-soft:#3d1c1a; --info:#6fd0e6; --info-soft:#14313a; --queue:#c0b3ff; --queue-soft:#2a2448;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:28px}
h3{font-size:19px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;gap:12px;align-items:center;margin-right:auto;min-width:0}
.logo{width:42px;height:42px;flex:none;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 19px var(--display);letter-spacing:.05em}
.brand b{font:700 21px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;display:block}
.brand small{color:var(--muted);font-size:13px;display:block}
.modes{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.modes button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;min-height:40px}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sync{font-size:13px;color:var(--muted);display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.live i{background:var(--ok)} .sync.local i{background:var(--warn)} .sync.err i{background:var(--crit)}
main{padding:24px 20px 72px;max-width:1240px;margin:0 auto}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:15px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.big{min-height:60px;font-size:19px;padding:0 28px;border-radius:12px}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.field{display:grid;gap:6px;min-width:0}
.lbl{font:600 14px var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input,textarea,select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--field);color:var(--ink);min-height:46px;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;align-items:start}
.field select + input{margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:18px}
.stack-sm{display:grid;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted)}

/* Licence plate chip (Ontario style) */
.plate{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#fdfdfb;color:#1c3f8c;border:2px solid #1c3f8c;border-radius:6px;padding:2px 9px 3px;line-height:1;box-shadow:0 1px 0 rgba(0,0,0,.12);vertical-align:middle;flex:none}
.plate small{font:700 7.5px/1 var(--body);letter-spacing:.24em;margin-bottom:2px}
.plate b{font:700 17px/1 var(--mono);letter-spacing:.05em;white-space:nowrap}
.plate.lg{padding:4px 14px 6px;border-width:3px;border-radius:8px}
.plate.lg small{font-size:10px}
.plate.lg b{font-size:30px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-info{color:var(--info);background:var(--info-soft)}
.t-accent{color:var(--accent);background:var(--accent-soft)}
.t-warn{color:var(--warn);background:var(--warn-soft)}
.t-ok{color:var(--ok);background:var(--ok-soft)}
.t-muted{color:var(--muted);background:var(--label-bg)}
.t-crit{color:var(--crit);background:var(--crit-soft)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--label-bg);color:var(--muted);white-space:nowrap}

/* Kiosk */
.kiosk{max-width:780px;margin:0 auto;display:grid;gap:20px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;font-size:14px;font-weight:600;color:var(--muted);border-top:4px solid var(--line);padding-top:8px}
.steps li::before{content:counter(s) "  ";font-family:var(--mono)}
.steps li.on{color:var(--ink);border-color:var(--accent)}
.steps li.done{color:var(--ink);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,32px);box-shadow:var(--shadow)}
.lede{font-size:19px;color:var(--muted);margin-top:8px;max-width:60ch}
.bigsearch{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:22px}
.bigsearch input{min-height:64px;font-size:24px;font-family:var(--mono);letter-spacing:.03em;padding:0 18px;border-width:2px;border-radius:12px}
@media (max-width:560px){.bigsearch{grid-template-columns:1fr}}
.try{margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--accent-soft);font-size:15px;display:grid;gap:8px}
.try-list{display:flex;flex-wrap:wrap;gap:8px}
.try-list button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;text-align:left}
.try-list button b{font-family:var(--mono)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:20px}
.tile{display:grid;gap:8px;align-content:start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;min-height:120px}
.tile:hover{border-color:var(--accent)}
.tile .t-title{font:700 20px/1.15 var(--display)}
.tile.add{place-content:center;text-align:center;border-style:dashed;color:var(--accent);font-weight:700;font-size:17px}
.summary{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.summary .who{display:grid;line-height:1.3}
.summary .who b{font:700 20px var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:48px;font-size:16px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.sm{min-height:36px;padding:5px 14px;font-size:14px}
.concern{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.concern .n{font:700 15px var(--mono);color:var(--muted);padding-top:12px;width:22px}
.auth{font-size:14px;color:var(--muted);background:var(--label-bg);border-radius:10px;padding:14px 16px;line-height:1.55}
.sigwrap{display:grid;gap:8px}
#sig{width:100%;height:170px;background:#fff;border:2px dashed var(--line-strong);border-radius:12px;touch-action:none;cursor:crosshair;display:block}
.voice{display:grid;gap:12px;padding:18px;border:2px solid var(--accent);border-radius:14px;background:var(--accent-soft)}
.voice textarea{min-height:120px;font-size:18px;line-height:1.45;background:var(--field)}
.voice-tip{display:flex;gap:8px;align-items:flex-start}
.voice-tip .mic{flex:none;color:var(--accent);margin-top:2px}
.ai-msg{font-size:15px;color:var(--muted)} .ai-msg.warn{color:var(--warn)}
.understood{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.safety{color:var(--crit);font-weight:600}
.intake{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.intake blockquote{margin:0;padding:4px 0 4px 14px;border-left:4px solid var(--accent);font-size:17px;font-style:italic}
.intake ul{margin:6px 0 0;padding-left:20px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.check input{width:24px;height:24px;min-height:0;flex:none;margin-top:1px;accent-color:var(--accent)}
.done-num{font:700 clamp(40px,9vw,64px)/1 var(--mono);letter-spacing:.02em;margin:14px 0 4px}
.radio-list{display:grid;gap:10px}
.radio{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px;accent-color:var(--accent)}
.radio b{display:block}

/* Workshop */
.ws{display:grid;gap:20px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs .count{font-family:var(--mono);font-size:13px;margin-left:6px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1200px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.board{grid-template-columns:1fr}}
.col{background:var(--label-bg);border-radius:14px;padding:10px;display:grid;gap:10px;min-height:120px;align-content:start}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 2px}
.col-h b{font:700 16px var(--display);text-transform:uppercase;letter-spacing:.06em}
.col-empty{font-size:14px;color:var(--muted);padding:10px 4px}
.wo-card{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tone,var(--line));border-radius:10px;padding:12px;cursor:pointer;box-shadow:var(--shadow);width:100%}
.wo-card:hover{border-color:var(--ink);border-left-color:var(--tone,var(--ink))}
.wo-card .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.wo-card .veh{display:flex;gap:10px;align-items:center}
.wo-card .veh span{font-weight:600;line-height:1.2}
.wo-card .concern-t{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wo-card .bot{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.tone-info{--tone:var(--info)} .tone-accent{--tone:var(--accent)} .tone-warn{--tone:var(--warn)} .tone-ok{--tone:var(--ok)} .tone-muted{--tone:var(--line-strong)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:600 13px var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;background:var(--label-bg);padding:9px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
td.r,th.r{text-align:right}
.results{display:grid;gap:18px}
.res-group{display:grid;gap:8px}
.res-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.res-item:hover{border-color:var(--accent)}
.res-item .grow{flex:1;min-width:0}
.demo{border-top:1px dashed var(--line-strong);padding-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}

/* Drawer */
#modal[hidden]{display:none}
.backdrop{position:fixed;inset:0;background:rgba(8,12,18,.55);display:flex;justify-content:flex-end;z-index:20}
.sheet{width:min(900px,100%);height:100%;overflow-y:auto;background:var(--paper);box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 14px}
.sheet-h .crumb{flex:1;font-weight:600;color:var(--muted);font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{padding:20px clamp(14px,3vw,28px) 40px;display:grid;gap:26px}
.sheet-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:auto}
.discard{background:var(--warn-soft);border-bottom:1px solid var(--warn);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.eyebrow{font:600 13px var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ticket{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--surface)}
.cell{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);min-height:50px}
.cell>.k{background:var(--label-bg);font:600 13px var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 12px;display:flex;align-items:center}
.cell>.v{padding:6px 12px;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.cell>.v input,.cell>.v select{min-height:38px;padding:6px 10px}
.sec{display:grid;gap:12px}
.lines td{padding:6px 8px}
.lines input,.lines select{min-height:40px;padding:6px 9px;font-size:15px}
.lines textarea{min-height:42px;padding:8px 10px;font-size:15px}
.lines .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:8px}
.x:hover{background:var(--crit-soft);color:var(--crit)}
.totals{margin-left:auto;width:min(340px,100%);display:grid;gap:0;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--surface)}
.totals div{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.totals div span:first-child{font:600 14px var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.totals div:last-child{border:0;background:var(--label-bg);font-weight:700;font-size:19px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.log li{position:relative;padding:4px 0 10px 18px;font-size:15px}
.log li::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.log time{display:block;font-size:13px;color:var(--muted)}
.timeline{display:grid;gap:10px}
.visit{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.visit:hover{border-color:var(--accent)}
.visit .d{font-weight:700;line-height:1.25}
.visit .d small{display:block;font-weight:500;color:var(--muted);font-size:13px}
@media (max-width:560px){.visit{grid-template-columns:1fr}.cell{grid-template-columns:120px 1fr}}
.owner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.owner .grow{flex:1;min-width:160px}
.sigimg{max-width:280px;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.inline-form{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:end}
@media (max-width:720px){.inline-form{grid-template-columns:1fr}}
details.edit{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.edit summary{padding:12px 14px;cursor:pointer;font-weight:600}
details.edit .inner{padding:0 14px 14px;display:grid;gap:14px}


/* Roles, sign-in, overlays */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rolechip{font:700 14px var(--display);text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:var(--paper);padding:5px 10px;border-radius:7px}
.who-bar{font-weight:600;font-size:15px}
.clock{font:700 20px var(--mono);font-variant-numeric:tabular-nums}
body[data-role="kiosk"] .sync,body[data-role="display"] .sync{display:none}
.auth-wrap{max-width:560px;margin:4vh auto 0}
.auth-wrap.wide{max-width:900px}
.err{color:var(--crit);font-weight:600}
.warn-note{color:var(--warn);font-weight:600;font-size:14px}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

#overlay[hidden]{display:none}
.ov-backdrop{position:fixed;inset:0;background:rgba(8,12,18,.6);display:grid;place-items:center;z-index:30;padding:16px}
.dialog{background:var(--surface);color:var(--ink);border-radius:16px;padding:24px;width:min(460px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dialog input[type=password]{font:700 26px var(--mono);letter-spacing:.3em;text-align:center}
.role-list{display:grid;gap:8px}
.role-row{display:grid;gap:2px;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.role-row:hover:not([disabled]){border-color:var(--accent)}
.role-row[disabled]{cursor:default;opacity:.65}
.tabs .count.hot{background:var(--crit);color:#fff;border-radius:999px;padding:0 7px}
.t-queue{color:var(--queue);background:var(--queue-soft)} .tone-queue{--tone:var(--queue)}
/* Front desk arrivals + job tag */
.arrivals{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.arrival,.tech-card{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tone,var(--info));border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.arrival.is-unsafe{border-left-color:var(--crit)}
.arrival .t-title{font:700 20px/1.15 var(--display)}
.concern-list{margin:0;padding-left:20px;display:grid;gap:2px}
.tagwrap{display:grid;gap:16px;justify-items:start}
.keytag{display:flex;gap:18px;align-items:center;background:#fff;color:#17202b;border:2px dashed #9aa3ad;border-radius:16px;padding:16px 20px;flex-wrap:wrap}
.kt-qr{width:180px;height:180px}
.kt-qr svg{width:100%;height:100%;display:block}
.kt-info{display:grid;gap:6px;justify-items:start}
.kt-info .eyebrow{color:#5b6573}
.kt-no{font:700 30px var(--mono)}
.qr-missing{width:180px;height:180px;display:grid;place-items:center;text-align:center;font-size:14px;border:1px solid #ccc;border-radius:8px}
/* Workshop */
.scan{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px;border-radius:16px;background:var(--accent-soft);border:2px solid var(--accent)}
.scan label.btn{cursor:pointer}
.tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
/* Display panel (waiting-room screen, always dark) */
body[data-role="display"]{--paper:#0c1016;--surface:#161c25;--ink:#eef1f5;--muted:#9ba6b4;--line:#283140;--line-strong:#3a4557;--label-bg:#1f2732;--accent:#8fb0ff;--accent-soft:#1b2843;--ok:#63d297;--ok-soft:#133022;--warn:#f3b955;--warn-soft:#38290f;--info:#73d3e8;--info-soft:#10303a;--queue:#c0b3ff;--queue-soft:#2a2448;color-scheme:dark}
body[data-role="display"] main{max-width:none;padding:24px clamp(16px,3vw,48px)}
.display{display:grid;gap:22px}
.d-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.d-head h1{font-size:clamp(36px,5vw,60px)}
.d-head p{color:var(--muted);font-size:clamp(17px,1.8vw,22px);margin-top:6px}
.d-counts{display:flex;gap:10px;flex-wrap:wrap}
.d-counts .pill{font-size:17px;padding:5px 14px}
.d-list{display:grid;gap:10px}
.d-row{display:grid;grid-template-columns:auto minmax(160px,1.4fr) minmax(180px,1fr) 150px 170px;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--tone);border-radius:14px;padding:14px 20px}
.d-row.is-ready{background:var(--ok-soft);border-color:var(--ok)}
.d-who{display:grid;line-height:1.2}
.d-who b{font:700 clamp(22px,2.2vw,30px) var(--display)}
.d-who span{color:var(--muted);font-size:17px}
.d-status .pill{font-size:clamp(16px,1.6vw,21px);padding:6px 16px}
.d-time{display:grid;font:600 20px var(--mono)}
.d-time .lbl{font-family:var(--display);font-size:13px}
.d-time .soon{font:600 16px var(--body);color:var(--muted)}
.d-empty{font-size:24px;color:var(--muted);padding:40px 0}
.d-foot{color:var(--muted);font-size:16px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:900px){.d-row{grid-template-columns:auto 1fr;}.d-time{display:none}}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">AR</div>
    <div><b>Demo Auto Repair</b><small>Work orders &amp; service history · proof of concept</small></div>
  </div>
  <div id="bar" class="bar"></div>
  <span id="sync" class="sync" role="status"><i></i><span>Connecting…</span></span>
</header>
<main id="app"></main>
<div id="modal" hidden></div>
<div id="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- constants ---------- */
const HST = 0.13;
const LABOUR_RATE = 140;
const STATUSES = [
  {id:'checked-in', label:'Waiting for keys', pub:'Checked in', tone:'info'},
  {id:'accepted', label:'In queue', pub:'In the queue', tone:'queue'},
  {id:'in-progress', label:'In progress', pub:'Being worked on', tone:'accent'},
  {id:'waiting-parts', label:'Waiting on parts', pub:'Waiting on parts', tone:'warn'},
  {id:'ready', label:'Ready for pickup', pub:'Ready for pickup', tone:'ok'},
  {id:'picked-up', label:'Picked up', pub:'Picked up', tone:'muted'}
];
const REASONS = [{id:'mechanical',label:'Mechanical'},{id:'body',label:'Body work'},{id:'accident',label:'Accident / tow'}];
const COLS = ['customers','vehicles','ownerships','workorders','staff'];
const LS_KEY = 'workshop-poc-v1';

/* ---------- data state ---------- */
const S = {customers:{}, vehicles:{}, ownerships:{}, workorders:{}, staff:{}};
const store = {mode:'connecting', db:null, readOnly:false, loaded:new Set(), stale:false, sample:null};

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const digits = s => String(s ?? '').replace(/\D/g,'');
const phone10 = s => { let d = digits(s); if (d.length === 11 && d[0] === '1') d = d.slice(1); return d; };
const fmtPhone = d => (d && d.length === 10) ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : esc(d || '—');
const normPlate = s => String(s ?? '').toUpperCase().replace(/[^A-Z0-9]/g,'');
const fmtPlate = p => /^[A-Z]{4}\d{3}$/.test(p) ? p.slice(0,4) + ' ' + p.slice(4) : (p || '');
const money = n => (Number(n) || 0).toLocaleString('en-CA', {style:'currency', currency:'CAD'});
const nowISO = () => new Date().toISOString();
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-CA', {year:'numeric', month:'short', day:'numeric'}) : '—';
const fmtDay = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('en-CA', {year:'numeric', month:'short', day:'numeric'}) : '—';
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-CA', {hour:'numeric', minute:'2-digit'});
const fmtDT = iso => iso ? fmtDate(iso) + ', ' + fmtTime(iso) : '—';
const ymd = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const km = n => (n || n === 0) && n !== '' ? Number(n).toLocaleString('en-CA') + ' km' : '—';
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const maskName = n => { const p = String(n || '').trim().split(/\s+/); return p.length > 1 ? p[0] + ' ' + p[p.length-1][0] + '.' : (p[0] || 'Customer'); };
const status = id => STATUSES.find(s => s.id === id) || STATUSES[0];
const statusPill = id => { const s = status(id); return `<span class="pill t-${s.tone}">${esc(s.label)}</span>`; };
const plate = (p, cls='') => `<span class="plate ${cls}" aria-label="Licence plate ${esc(fmtPlate(p))}"><small>ONTARIO</small><b>${esc(fmtPlate(p) || '—')}</b></span>`;
const vName = v => v ? [v.year, v.make, v.model].filter(Boolean).join(' ') || 'Vehicle' : 'Unknown vehicle';
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  const d = Math.round(h / 24); return d === 1 ? 'yesterday' : d + ' days ago';
}
function stable(o){
  if (Array.isArray(o)) return '[' + o.map(stable).join(',') + ']';
  if (o && typeof o === 'object') return '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + stable(o[k])).join(',') + '}';
  return JSON.stringify(o ?? null);
}
function toggleIn(arr, v){ const i = arr.indexOf(v); if (i >= 0) arr.splice(i,1); else arr.push(v); }

/* ---------- queries ---------- */
const list = col => Object.entries(S[col]).map(([id, v]) => ({id, ...v}));
const ownershipsOfVehicle = vid => list('ownerships').filter(o => o.vehicleId === vid).sort((a,b) => (b.from || '').localeCompare(a.from || ''));
const currentOwners = vid => ownershipsOfVehicle(vid).filter(o => !o.to);
const ownershipsOfCustomer = cid => list('ownerships').filter(o => o.customerId === cid).sort((a,b) => (b.from || '').localeCompare(a.from || ''));
const wosOfVehicle = vid => list('workorders').filter(w => w.vehicleId === vid).sort((a,b) => b.createdAt.localeCompare(a.createdAt));
const wosOfCustomer = cid => list('workorders').filter(w => w.customerId === cid).sort((a,b) => b.createdAt.localeCompare(a.createdAt));
const customerByPhone = ph => list('customers').find(c => c.phone === ph);
function findCustomersByPhone(q){
  const d = phone10(q); if (d.length < 7) return [];
  return list('customers').filter(c => c.phone === d || (d.length < 10 && c.phone.endsWith(d)));
}
function findVehicleByPlate(q){ const p = normPlate(q); if (p.length < 2) return null; return list('vehicles').find(v => v.plate === p) || null; }
function lastOdo(vid){ const o = wosOfVehicle(vid).map(w => Number(w.odometer) || 0).filter(Boolean); return o.length ? Math.max(...o) : null; }
function lastVisit(vid){ const w = wosOfVehicle(vid)[0]; return w ? w.createdAt : null; }
function totals(w){
  let parts = 0, labour = 0;
  (w.items || []).forEach(it => { const a = (Number(it.qty) || 0) * (Number(it.price) || 0); if (it.type === 'labour') labour += a; else parts += a; });
  const tax = Math.round((parts + labour) * HST * 100) / 100;
  const estimate = (w.concerns || []).reduce((s, c) => s + (Number(c.estimate) || 0), 0);
  return {parts, labour, tax, total: parts + labour + tax, estimate};
}
function nextOrderNo(){
  const d = new Date();
  const pre = String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const n = list('workorders').filter(w => String(w.orderNo).startsWith(pre)).length + 1;
  return pre + '-' + String(n).padStart(2,'0');
}

/* ---------- persistence ---------- */
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} }
function loadLocal(){ try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); COLS.forEach(c => S[c] = d[c] || {}); } } catch(e) {} }
const queues = {};
function onWriteError(e){
  const code = e && e.code;
  if (code === 'invalid_argument') { store.readOnly = true; toast('You can view these records but not change them.'); render(); }
  else if (code === 'quota_exceeded') toast('Storage is full. Clear old records, then try again.');
  else if (code === 'revoked') toast('Access to saved records ended. Reload the page.');
  else toast('Could not save. Check your connection and try again.');
}
function put(col, id, data){
  if (store.readOnly) { toast('You can view these records but not change them.'); return Promise.resolve(false); }
  S[col] = {...S[col], [id]: data};
  if (store.mode === 'db') {
    const key = col + '/' + id;
    const p = (queues[key] || Promise.resolve()).then(() => store.db.collection(col).doc(id).set(data)).then(() => true, e => { onWriteError(e); return false; });
    queues[key] = p;
    return p;
  }
  saveLocal(); return Promise.resolve(true);
}
function remove(col, id){
  const next = {...S[col]}; delete next[id]; S[col] = next;
  if (store.mode === 'db') {
    const key = col + '/' + id;
    const p = (queues[key] || Promise.resolve()).then(() => store.db.collection(col).doc(id).delete()).then(() => true, e => { onWriteError(e); return false; });
    queues[key] = p; return p;
  }
  saveLocal(); return Promise.resolve(true);
}
const ready = () => store.mode === 'local' || store.loaded.size === COLS.length || store.stale;

async function init(){
  let db = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then(s => { store.sample = s || null; scheduleRender(); }, () => {});
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user').catch(() => null)]);
    }
  } catch(e) { db = null; }
  if (!db) { store.mode = 'local'; loadLocal(); render(); return; }
  store.db = db; store.mode = 'db';
  if (user && typeof user.can === 'function') {
    try { const w = await user.can('data.write'); if (w === false) store.readOnly = true; } catch(e) {}
  }
  const timer = setTimeout(() => { if (store.loaded.size < COLS.length) { store.stale = true; scheduleRender(); } }, 10000);
  COLS.forEach(col => {
    db.collection(col).onSnapshot(snap => {
      const o = {};
      snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
      S[col] = o;
      if (!snap.metadata.fromCache) store.loaded.add(col);
      if (store.loaded.size === COLS.length) { clearTimeout(timer); store.stale = false; }
      scheduleRender();
    }, err => {
      store.loaded.add(col); store.stale = true;
      if (err && err.code === 'revoked') store.readOnly = true;
      scheduleRender();
    });
  });
  render();
}

/* ---------- UI state ---------- */
const blankReg = () => ({name:'', phone:'', email:'', plate:'', year:'', make:'', model:'', vin:'', engine:'', story:'', filled:false});
const blankVeh = () => ({plate:'', year:'', make:'', model:'', vin:'', engine:''});
const blankVisit = cid => ({reasons:['mechanical'], odometer:'', concerns:[''], signName: (S.customers[cid] || {}).name || '', sig:null, agree:false, story:'', intake:null});
const ai = {busy:false, msg:'', tone:''};
const ui = {
  checkin: null,
  ws: {tab:'board', q:'', confirmClear:false},
  other: {},
  modals: []
};
function resetCheckin(){
  ui.other = {};
  clearTimeout(doneTimer); ai.msg = ''; ai.tone = '';
  ui.checkin = {step:'search', q:'', customerId:null, vehicleId:null, candidates:[], reg:blankReg(), veh:blankVeh(), link:{phone:'', name:'', mode:'transfer'}, visit:blankVisit(null), doneWo:null};
}
let doneTimer = null;
resetCheckin();
const topModal = () => ui.modals[ui.modals.length - 1] || null;
function rootFor(seg){ return seg === 'top' ? topModal() : ui[seg]; }
function getPath(path){ const s = path.split('.'); let o = rootFor(s[0]); for (let i = 1; i < s.length && o != null; i++) o = o[s[i]]; return o ?? ''; }
function setPath(path, val){ const s = path.split('.'); let o = rootFor(s[0]); for (let i = 1; i < s.length - 1; i++) { if (o == null) return; o = o[s[i]]; } if (o != null) o[s[s.length-1]] = val; }
const bind = (path, extra='') => `data-bind="${path}" value="${esc(getPath(path))}" ${extra}`;

/* ---------- render ---------- */
let renderQueued = false, deferred = false, lastAutofocus = '';
function scheduleRender(){
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    const a = document.activeElement;
    if (a && a.matches && a.matches('input,textarea,select')) { deferred = true; renderChrome(); return; }
    render();
  });
}
document.addEventListener('focusout', () => {
  if (!deferred) return;
  setTimeout(() => {
    const a = document.activeElement;
    if (a && a.matches && a.matches('input,textarea,select')) return;
    deferred = false; render();
  }, 0);
});
function renderChrome(){
  document.body.dataset.role = (me() && session.role) || 'none';
  const bar = $('#bar'), bh = barHTML(); if (bar.innerHTML !== bh) bar.innerHTML = bh;
  const ck = $('#clock'); if (ck) ck.textContent = fmtTime(nowISO());
  const el = $('#sync'); let cls = '', txt = '';
  if (store.mode === 'connecting') { txt = 'Connecting…'; }
  else if (store.mode === 'local') { cls = 'local'; txt = 'Saved in this browser only'; }
  else if (store.stale) { cls = 'err'; txt = 'Records may be out of date'; }
  else if (!ready()) { txt = 'Loading records…'; }
  else { cls = 'live'; txt = store.readOnly ? 'Live · view only' : 'Live · shared across devices'; }
  el.className = 'sync ' + cls; el.lastElementChild.textContent = txt;
}
function currentView(){
  if (!ready()) return `<div class="auth-wrap"><div class="card"><h2>Loading records…</h2></div></div>`;
  if (!activeAdmins().length) return viewSetup();
  const u = me();
  if (!u || u.active === false || session.expires <= Date.now()) return viewLogin();
  if (!session.role || !(u.roles || []).includes(session.role)) return viewRolePick();
  switch (session.role) {
    case 'kiosk': return viewCheckin();
    case 'workshop': return viewTech();
    case 'display': return viewDisplay();
    default: return viewDesk(session.role);
  }
}
function render(){
  deferred = false;
  renderChrome();
  const winY = window.scrollY;
  $('#app').innerHTML = (store.readOnly ? `<div class="banner">You can look up records here, but changes won't be saved. Ask the page owner for edit access.</div>` : '') + currentView();
  window.scrollTo(0, winY);
  renderModal();
  renderOverlay();
  initSig();
  const af = document.querySelector('[data-autofocus]');
  const key = (session.staffId || '-') + ':' + session.role + ':' + (ui.checkin && ui.checkin.step) + ':' + ui.ws.tab + ':' + ui.modals.length;
  if (af && key !== lastAutofocus && !topModal() && !ui.overlay) { af.focus({preventScroll:true}); }
  lastAutofocus = key;
}

/* ---------- check-in (kiosk) ---------- */
const STEP_INDEX = {search:0, notFound:0, pickCustomer:0, register:1, pickVehicle:1, whoAreYou:1, addVehicle:1, linkOwner:1, visit:2, done:3};
function viewCheckin(){
  const c = ui.checkin;
  const idx = STEP_INDEX[c.step] ?? 0;
  const labels = ['Find your records', 'Choose your vehicle', 'Describe the problem & sign'];
  const steps = `<ol class="steps" aria-label="Check-in progress">${labels.map((l, i) => `<li class="${i < idx ? 'done' : i === idx ? 'on' : ''}"${i === idx ? ' aria-current="step"' : ''}>${l}</li>`).join('')}</ol>`;
  const body = ({search:stepSearch, notFound:stepNotFound, pickCustomer:stepPickCustomer, pickVehicle:stepPickVehicle, whoAreYou:stepWho, register:stepRegister, addVehicle:stepAddVehicle, linkOwner:stepLinkOwner, visit:stepVisit, done:stepDone}[c.step] || stepSearch)();
  return `<section class="kiosk">${c.step === 'done' ? '' : steps}${body}</section>`;
}
function stepSearch(){
  const ok = ready();
  const samples = S.customers['c-priya'] ? `
    <div class="try"><b>Try the sample records</b>
      <div class="try-list">
        <button type="button" data-act="trySample" data-arg="416 555 0142"><b>416 555 0142</b><br><span class="muted">Customer with two vehicles</span></button>
        <button type="button" data-act="trySample" data-arg="BXRT 552"><b>BXRT 552</b><br><span class="muted">Car sold to a new owner</span></button>
        <button type="button" data-act="trySample" data-arg="DKPL 870"><b>DKPL 870</b><br><span class="muted">Car shared by two owners</span></button>
      </div></div>` : (ok && !Object.keys(S.customers).length ? `<div class="try"><b>No records yet.</b><span>Register a customer below, or <button type="button" class="link" data-act="loadSample">load sample records</button> to try the lookup.</span></div>` : '');
  return `<div class="card">
    <h1>Welcome. Let's check in your vehicle.</h1>
    <p class="lede">Enter your phone number or licence plate and we'll pull up your records.</p>
    <form class="bigsearch" data-submit="search" autocomplete="off">
      <label for="q" class="sr">Phone number or licence plate</label>
      <input id="q" ${bind('checkin.q')} placeholder="Phone or plate" inputmode="text" autocapitalize="characters" spellcheck="false" data-autofocus>

function initSig(){
  const c = document.getElementById('sig'); if (!c) return;
  const r = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = Math.round(w * r); c.height = Math.round(h * r);
  const ctx = c.getContext('2d'); ctx.scale(r, r);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14213d';
  sigCtx = ctx;
  if (ui.checkin.visit.sig) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, w, h); img.src = ui.checkin.visit.sig; }
  let drawing = false, last = null;
  const pos = e => { const b = c.getBoundingClientRect(); return {x: e.clientX - b.left, y: e.clientY - b.top}; };
  c.onpointerdown = e => { drawing = true; last = pos(e); try { c.setPointerCapture(e.pointerId); } catch(_) {} ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI*2); ctx.fillStyle = '#14213d'; ctx.fill(); };
  c.onpointermove = e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => {
    if (!drawing) return; drawing = false;
    const o = document.createElement('canvas'); o.width = 480; o.height = Math.round(480 * h / w);
    const x = o.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, o.width, o.height); x.drawImage(c, 0, 0, o.width, o.height);
    ui.checkin.visit.sig = o.toDataURL('image/jpeg', 0.72);
    const hint = document.getElementById('sig-hint'); if (hint) hint.textContent = 'Signature captured.';
  };
}

function woFooter(m, d){
  const save = `<button type="button" class="btn primary" data-act="woSave">${m.isNew ? 'Create work order' : 'Save changes'}</button>`;
  if (m.isNew) return save;
  const go = (to, label, cls = '') => `<button type="button" class="btn ${cls}" data-act="woTo" data-arg="${to}">${label}</button>`;
  const b = [];
  if (session.role === 'workshop') {
    if (d.status === 'accepted') b.push(go('in-progress', 'Take job', 'primary'));
    if (d.status === 'in-progress') { b.push(go('waiting-parts', 'Waiting on parts')); b.push(go('ready', 'Work complete', 'primary')); }
    if (d.status === 'waiting-parts') b.push(go('in-progress', 'Resume work', 'primary'));
    b.push(save.replace('btn primary', 'btn'));
  } else {
    if (d.status === 'checked-in') b.push(go('accepted', 'Keys received, accept job', 'primary'));
    if (['accepted', 'in-progress', 'waiting-parts', 'ready'].includes(d.status)) b.push(`<button type="button" class="btn" data-act="showTag" data-arg="${m.id}">Job QR tag</button>`);
    if (d.status === 'ready') b.push(go('picked-up', 'Mark picked up'));
    b.push(d.status === 'checked-in' ? save.replace('btn primary', 'btn') : save);
  }
  return b.join('');
}

function loadSession(){ try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); if (s && s.expires > Date.now()) Object.assign(session, s); } catch(e) {} }
function saveSession(){ try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch(e) {} }

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
async function hashPin(email, pin){
  const txt = String(email).toLowerCase().trim() + ':' + String(pin);
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch(e) { let h = 0; for (const c of txt) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + (h >>> 0).toString(16); }
}
function defaultTab(role){ return role === 'admin' ? 'staff' : role === 'frontdesk' ? 'arrivals' : 'board'; }

/* ---------- job workflow ---------- */
function applyTransition(d, from, to, now){
  if (from === to) return;
  const u = me(), who = u ? u.name : 'Staff';
  d.log = d.log || [];
  if (to === 'accepted') { d.acceptedAt = now; d.acceptedBy = who; if (!d.receivedBy) d.receivedBy = who; d.log.push({at:now, text:'Keys received by ' + who + '. Job added to the workshop queue'}); }
  else if (to === 'in-progress') {
    if (!d.startedAt) d.startedAt = now;
    if (u && (session.role === 'workshop' || !d.techId)) { d.techId = u.id; d.techName = u.name; }
    d.log.push({at:now, text: from === 'waiting-parts' ? 'Work resumed by ' + who : 'Job taken up by ' + who});
  }
  else if (to === 'waiting-parts') d.log.push({at:now, text:'Waiting on parts. Set by ' + who});
  else if (to === 'ready') { d.completedAt = now; d.log.push({at:now, text:'Work completed by ' + who + '. Ready for pickup'}); }
  else if (to === 'picked-up') { d.pickedUpAt = now; if (!d.pickupDate) d.pickupDate = ymd(now); d.log.push({at:now, text:'Picked up. Vehicle released by ' + who}); }
  else d.log.push({at:now, text:'Status changed to ' + status(to).label + ' by ' + who});
}
function transitionJob(id, to){
  const w = S.workorders[id]; if (!w) return null;
  const d = clone(w), now = nowISO();
  applyTransition(d, w.status, to, now);
  d.status = to; d.updatedAt = now;
  put('workorders', id, d);
  const m = topModal(); if (m && m.type === 'wo' && m.id === id) { m.draft = clone(d); m.confirmDiscard = false; }
  return d;
}
function qrSVG(text, cell = 6){
  if (typeof qrcode !== 'function') return `<div class="qr-missing">QR code unavailable. Use the job number.</div>`;
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({cellSize:cell, margin:2, scalable:true});
}
const jobCode = id => 'WO:' + id;
function openJobFromCode(txt){
  const t = String(txt || '').trim();
  let id = null;
  const m = t.match(/^WO:(.+)$/i);
  if (m && S.workorders[m[1]]) id = m[1];
  else { const no = t.replace(/^#/, ''); const w = list('workorders').find(w => w.orderNo === no) || (digits(no).length >= 3 ? list('workorders').filter(w => w.status !== 'picked-up').find(w => digits(w.orderNo).endsWith(digits(no))) : null); if (w) id = w.id; }
  if (!id) { toast('No job found for “' + t + '”.'); return; }
  ACT.openWO(id);
}
function decodeQR(file){
  if (!file) return;
  if (typeof jsQR !== 'function') { toast("The QR reader didn't load. Type the job number instead."); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const sc = Math.min(1, 1400 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(img, 0, 0, c.width, c.height);
    const data = x.getImageData(0, 0, c.width, c.height);
    const code = jsQR(data.data, c.width, c.height, {inversionAttempts:'attemptBoth'});
    URL.revokeObjectURL(url);
    if (!code) { toast("Couldn't find a QR code in that photo. Move closer and try again, or type the job number."); return; }
    openJobFromCode(code.data);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Couldn't open that photo. Try again."); };
  img.src = url;
}
document.addEventListener('change', e => { if (e.target && e.target.id === 'qr-file') { decodeQR(e.target.files && e.target.files[0]); e.target.value = ''; } });

/* ---------- domain actions ---------- */
function ensureCustomer(phone, name){
  const ph = phone10(phone);
  if (ph.length !== 10) return {error:'Enter a 10-digit phone number.'};
  const found = customerByPhone(ph);
  if (found) return {id: found.id, existing: true};
  if (!String(name).trim()) return {error:'Enter the full name for this new customer.'};
  const id = uid('c');
  put('customers', id, {name:String(name).trim(), phone:ph, email:'', createdAt:nowISO()});
  return {id, existing:false};
}
function attachOwner(vid, cid, mode, source){
  const cur = currentOwners(vid);
  if (cur.some(o => o.customerId === cid)) return;
  const now = nowISO();
  if (mode === 'transfer') cur.forEach(o => { const {id, ...rest} = o; put('ownerships', id, {...rest, to: now, endedReason: 'Sold / transferred'}); });
  put('ownerships', uid('o'), {vehicleId:vid, customerId:cid, from:now, to:null, role:(mode === 'co-owner' && cur.length) ? 'co-owner' : 'owner', verified: source === 'staff' || !cur.length, source});
}
function validateVehicle(f){
  const p = normPlate(f.plate);
  if (p.length < 2 || p.length > 8) return 'Enter the licence plate (2 to 8 letters and numbers).';
  if (!String(f.make).trim() || !String(f.model).trim()) return 'Enter the make and model.';
  if (f.year && !/^(19|20)\d{2}$/.test(String(f.year).trim())) return 'Enter a 4-digit year, like 2019.';
  if (f.vin && String(f.vin).trim().length !== 17) return 'A VIN has 17 characters. Leave it blank if unsure.';
  return '';
}
function vehicleDoc(f){ return {plate:normPlate(f.plate), year:String(f.year).trim(), make:String(f.make).trim(), model:String(f.model).trim(), vin:String(f.vin || '').trim().toUpperCase(), engine:String(f.engine || '').trim()}; }
/* Returns the next check-in step for this customer + vehicle form */
function vehicleForCustomer(cid, f){
  const existing = findVehicleByPlate(f.plate);
  if (existing) {
    const mine = currentOwners(existing.id).some(o => o.customerId === cid);
    if (mine) return {step:'visit', vehicleId:existing.id};
    if (!currentOwners(existing.id).length) { attachOwner(existing.id, cid, 'transfer', 'kiosk'); return {step:'visit', vehicleId:existing.id}; }
    return {step:'linkOwner', vehicleId:existing.id};
  }
  const vid = uid('v');
  put('vehicles', vid, {...vehicleDoc(f), createdAt:nowISO()});
  put('ownerships', uid('o'), {vehicleId:vid, customerId:cid, from:nowISO(), to:null, role:'owner', verified:true, source:'kiosk'});
  return {step:'visit', vehicleId:vid};
}
function go(patch){
  if (patch.step && patch.step !== ui.checkin.step) { ai.msg = ''; ai.tone = ''; }
  Object.assign(ui.checkin, patch);
  if (patch.step === 'visit' && !patch.visit) ui.checkin.visit = blankVisit(ui.checkin.customerId);
  render(); window.scrollTo(0, 0);
}

async function loadSample(){

/* ---------- events ---------- */
function handleBind(e){
  const t = e.target, b = t.dataset && t.dataset.bind; if (!b) return;
  let val = t.type === 'checkbox' ? t.checked : t.value;
  if (t.type === 'radio' && !t.checked) return;
  setPath(b, val);
  if (t.dataset.live === 'wo') updateWoLive();
  if (t.dataset.live === 'find') { const r = $('#find-results'); if (r) r.innerHTML = findResults(ui.ws.q); }
}
document.addEventListener('input', handleBind);
document.addEventListener('change', handleBind);
document.addEventListener('click', e => {
  if (e.target.id === 'ov-backdrop') { ui.overlay = null; render(); return; }
  const bd = e.target.id === 'backdrop'; if (bd) { leave(true); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.arg, el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.overlay) { ui.overlay = null; render(); return; }
  if (e.key === 'Escape' && topModal()) { leave(true); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) { e.preventDefault(); const fn = ACT[e.target.dataset.act]; if (fn) fn(e.target.dataset.arg); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-submit]'); if (!f) return;
  e.preventDefault(); const fn = SUBMIT[f.dataset.submit]; if (fn) fn();
});
document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.keep && topModal()) topModal()[d.dataset.keep] = d.open; }, true);
let toastTimer = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }
setInterval(() => { if (!topModal() && !ui.overlay) scheduleRender(); else renderChrome(); if (session.expires && session.expires <= Date.now() && session.staffId) signOut(); }, 30000);

/* ---------- start ---------- */
loadSession();
render();
init();
